name: Release

# Build downloadable app bundles for Windows/macOS/Linux and publish a GitHub Release.
# Trigger by pushing a version tag, e.g.  git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ['v*']
  workflow_dispatch: # manual runs build artifacts (no release)

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, label: windows }
          - { os: macos-latest,   label: macos }
          - { os: ubuntu-latest,  label: linux }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compute version
        shell: bash
        run: |
          REF="${GITHUB_REF_NAME}"
          if [[ "$REF" == v* ]]; then echo "APP_VERSION=${REF#v}" >> "$GITHUB_ENV";
          else echo "APP_VERSION=1.0.0" >> "$GITHUB_ENV"; fi

      - name: Build runnable jar
        run: mvn -B -ntp clean package -DskipTests

      - name: Package self-contained app (jpackage)
        shell: bash
        run: |
          mkdir -p staging dist
          cp target/LevelSketcher.jar staging/
          jpackage --type app-image --name LevelSketcher \
            --input staging --main-jar LevelSketcher.jar \
            --main-class io.github.avery07.Main \
            --app-version "$APP_VERSION" --dest dist

      - name: Zip app bundle
        shell: bash
        run: |
          cd dist
          if [ "${{ matrix.label }}" = "windows" ]; then
            7z a -tzip "LevelSketcher-${{ matrix.label }}.zip" LevelSketcher >/dev/null
          else
            zip -qr "LevelSketcher-${{ matrix.label }}.zip" LevelSketcher*
          fi

      - name: Stage runnable jar (needs Java 21)
        shell: bash
        run: cp target/LevelSketcher.jar "dist/LevelSketcher-${{ matrix.label }}.jar"

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.label }}
          path: |
            dist/LevelSketcher-${{ matrix.label }}.zip
            dist/LevelSketcher-${{ matrix.label }}.jar

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
